name: Test Phoenix Rehab Web Pilot
on:
  push:
    paths:
      - 'apps/phoenix-rehab-pilot/**'
      - 'logos/brush-slash.svg'
      - 'motifs/marker-swash.svg'
      - '.github/workflows/test-phoenix-pilot.yml'
  pull_request:
    paths:
      - 'apps/phoenix-rehab-pilot/**'
      - 'logos/brush-slash.svg'
      - 'motifs/marker-swash.svg'
      - '.github/workflows/test-phoenix-pilot.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test apps/phoenix-rehab-pilot/test/engine.test.mjs
