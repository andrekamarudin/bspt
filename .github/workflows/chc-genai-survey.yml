name: CHC GenAI survey & logic page
on:
  push:
    paths:
      - 'apps/ai-learning-discovery/**'
      - '.github/workflows/chc-genai-survey.yml'
  pull_request:
    paths:
      - 'apps/ai-learning-discovery/**'
      - '.github/workflows/chc-genai-survey.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node apps/ai-learning-discovery/scripts/verify.mjs
