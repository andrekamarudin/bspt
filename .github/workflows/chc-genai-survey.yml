name: CHC GenAI survey & logic page
on:
  push:
    paths:
      - 'apps/ai-learning-discovery/**'
      - '.github/workflows/chc-genai-survey.yml'
  pull_request:
    paths:
      - 'apps/ai-learning-discovery/**'
      - '.github/workflows/chc-genai-survey.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node apps/ai-learning-discovery/scripts/verify.mjs
