name: Rebuild AI Mental OS v4 presentation
on:
  push:
    branches: [main]
    paths:
      - 'training/ai-mental-os/v4/**'
      - '.github/workflows/build-ai-mental-os-v4.yml'
  pull_request:
    paths:
      - 'training/ai-mental-os/v4/**'
      - '.github/workflows/build-ai-mental-os-v4.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training/ai-mental-os/v4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fonts and OS dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-liberation libreoffice-impress poppler-utils
      - name: Install runtime dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements.txt
      - name: Build, test and verify editable PPTX
        run: bash build.sh
      - name: Render 30-slide preview from committed PowerPoint source
        run: python render_preview.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BSPT_AI_Mental_OS_Training_v4
          path: training/ai-mental-os/v4/BSPT_AI_Mental_OS_Training_v4.pptx
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BSPT_AI_Mental_OS_v4_preview
          path: training/ai-mental-os/v4/BSPT_AI_Mental_OS_v4_preview.png
          if-no-files-found: error
          retention-days: 90
