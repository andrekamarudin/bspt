name: Build BSPT collaboration motion GIF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering libraries
        run: python -m pip install "Pillow>=11,<13" "CairoSVG>=2.7,<3"
      - name: Bootstrap renderer source
        shell: bash
        run: |
          mkdir -p scripts
          echo '' | base64 --decode | python -c "import sys,zlib,pathlib; pathlib.Path('scripts/render_collaboration_motion.py').write_bytes(zlib.decompress(sys.stdin.buffer.read()))"
      - name: Rebuild with canonical BSPT assets
        shell: bash
        run: |
          test -s logos/brush-slash.svg
          test -s motifs/paperclip.svg
          test -s motifs/marker-swash.svg
          python scripts/render_collaboration_motion.py
      - name: Commit renderer and actual SVG-backed GIF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render_collaboration_motion.py motion/collaboration-with-ai.gif
          if ! git diff --cached --quiet; then
            git commit -m "feat(motion): show faster AI collaboration with exact BSPT SVG"
            git push origin HEAD:main
          fi
