name: Build BSPT collaboration motion GIF

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/render_collaboration_motion.py
      - scripts/extract_collaboration_avatars.py
      - assets/collaboration-avatars/character-atlas.png
      - logos/brush-slash.svg
      - motifs/paperclip.svg
      - motifs/marker-swash.svg

permissions:
  contents: write

concurrency:
  group: bspt-collaboration-motion
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install "Pillow>=11,<13" "CairoSVG>=2.7,<3"
      - name: Verify official BSPT vector assets exist
        shell: bash
        run: |
          test -s logos/brush-slash.svg
          test -s motifs/paperclip.svg
          test -s motifs/marker-swash.svg
      - name: Extract isolated character PNGs from approved atlas
        run: python scripts/extract_collaboration_avatars.py
      - name: Render one-shot collaboration animation
        run: python scripts/render_collaboration_motion.py
      - name: Commit the generated GIF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/collaboration-avatars/*.png motion/collaboration-with-ai.gif
          if ! git diff --cached --quiet; then
            git commit -m "assets(motion): rebuild SVG-backed AI collaboration GIF"
            git push origin HEAD:main
          fi
