name: Paid AI Mental OS curriculum
on:
  push:
    branches: [main]
    paths:
      - 'content/paid-training/**'
      - 'scripts/verify-paid-training.mjs'
      - '.github/workflows/paid-training.yml'
  pull_request:
    paths:
      - 'content/paid-training/**'
      - 'scripts/verify-paid-training.mjs'
      - '.github/workflows/paid-training.yml'
concurrency:
  group: bspt-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Curriculum structure and timing checks
        run: node scripts/verify-paid-training.mjs
