name: Nugget vault integrity
on:
  push:
    branches: [main]
    paths:
      - 'content/nuggets/**'
      - 'scripts/verify-nuggets.mjs'
      - '.github/workflows/nugget-vault.yml'
  pull_request:
    paths:
      - 'content/nuggets/**'
      - 'scripts/verify-nuggets.mjs'
      - '.github/workflows/nugget-vault.yml'
concurrency:
  group: bspt-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-nuggets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify nugget vault
        run: node scripts/verify-nuggets.mjs
