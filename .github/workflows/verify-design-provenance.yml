name: Verify BSPT GitHub/Figma source provenance
on:
  push:
    branches: [main]
    paths:
      - 'design/figma-asset-manifest.json'
      - 'docs/source-of-truth.md'
      - 'scripts/verify-figma-source.mjs'
      - 'logos/**'
      - 'motifs/**'
      - 'motion/**'
      - 'assets/collaboration-avatars/**'
      - 'training/ai-mental-os/v4/base/assets/**'
      - 'training/ai-mental-os/v5/**'
      - '.github/workflows/verify-design-provenance.yml'
  pull_request:
    paths:
      - 'design/figma-asset-manifest.json'
      - 'docs/source-of-truth.md'
      - 'scripts/verify-figma-source.mjs'
      - 'logos/**'
      - 'motifs/**'
      - 'motion/**'
      - 'assets/collaboration-avatars/**'
      - 'training/ai-mental-os/v4/base/assets/**'
      - 'training/ai-mental-os/v5/**'
      - '.github/workflows/verify-design-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bspt-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/verify-figma-source.mjs
